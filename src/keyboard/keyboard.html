<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Virtual keyboard</title>
  </head>

  <body>
    <div style="overflow: hidden;" id="root"></div>
    <script>
      {
        // window.nexusEnv is exposed by the keyboard preload script via
        // contextBridge, since contextIsolation:true means this page cannot
        // read process.env directly.
        const nexusEnv = window.nexusEnv || {};
        if (nexusEnv.NODE_ENV === 'development') {
          document.write(
            '<script defer src="../../dll/renderer.dev.dll.js"><\/script>'
          );
        }

        const port = nexusEnv.PORT || 1212;
        const script =
          nexusEnv.NODE_ENV === 'development'
            ? 'http://localhost:' + port + '/keyboard.dev.js'
            : './keyboard.prod.js';
        document.write('<script defer src="' + script + '"><\/script>');
      }
    </script>
  </body>
</html>
