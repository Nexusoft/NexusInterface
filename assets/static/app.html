<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Nexus</title>
  </head>

  <body>
    <div style="overflow: hidden" id="root"></div>
    <script>
      {
        // window.nexusEnv is exposed by the main preload script (works
        // whether or not this window has contextIsolation enabled -- see
        // src/main/preload.js), since this page cannot reliably read
        // process.env directly across all supported window configurations.
        const nexusEnv = window.nexusEnv || {};
        const scripts = [];

        // Dynamically insert the DLL script in development env in the
        // renderer process
        if (nexusEnv.NODE_ENV === 'development') {
          scripts.push('renderer.dev.dll.js');
        }

        // Dynamically insert the bundled app script in the renderer process
        const port = nexusEnv.PORT || 1212;
        scripts.push(
          nexusEnv.NODE_ENV === 'development'
            ? 'http://localhost:' + port + '/renderer.dev.js'
            : './renderer.prod.js'
        );

        document.write(
          scripts
            .map((script) => '<script defer src="' + script + '"><\/script>')
            .join('')
        );

        window.onload = () => {
          document.addEventListener('auxclick', function handleNonLeftClick(e) {
            if (e.button === 1 || e.ctrlKey) {
              e.preventDefault();
            }
          });
        };
      }
    </script>
  </body>
</html>
