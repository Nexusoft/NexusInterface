name: Build embedded Linux core

on:
  push:
    branches:
      - copilot/refresh-node5-embedded-cores
    paths:
      - .github/workflows/build-embedded-core-linux.yml
      - .github/build-embedded-core-linux.sh

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out build script
        uses: actions/checkout@v4
      - name: Check out core source
        uses: actions/checkout@v4
        with:
          repository: NamecoinGithub/LLL-TAO
          ref: 987fa69b5feeb575083a0a2c3acc71c428236f67
          path: core-source
      - name: Build core
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work/core-source \
            quay.io/pypa/manylinux2014_x86_64 \
            bash /work/.github/build-embedded-core-linux.sh
      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: linux-core
          path: core-source/core/
          if-no-files-found: error
