name: Build embedded macOS core

on:
  push:
    branches:
      - copilot/refresh-node5-embedded-cores
    paths:
      - .github/workflows/build-embedded-core-macos.yml

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Check out core source
        uses: actions/checkout@v4
        with:
          repository: NamecoinGithub/LLL-TAO
          ref: 04eb09340bb20852c081b84fdb9c7b2e3de4a7d2
      - name: Build static dependencies
        shell: bash
        run: |
          set -euxo pipefail
          export MACOSX_DEPLOYMENT_TARGET=10.13
          cd "$RUNNER_TEMP"
          curl -fsSL -o db.tar.gz https://download.oracle.com/berkeley-db/db-5.3.28.tar.gz
          echo 'e0a992d740709892e81f9d93f06daf305cf73fb81b545afe72478043172c3628  db.tar.gz' | shasum -a 256 -c
          tar -xf db.tar.gz
          base=https://raw.githubusercontent.com/Homebrew/homebrew-core/d0a6af6128601bb3f2ba09f5aead358d8000c071/Patches
          curl -fsSL -o clang.diff "$base/berkeley-db%404/clang.diff"
          curl -fsSL -o libtool.diff "$base/libtool/configure-pre-0.4.2.418-big_sur.diff"
          curl -fsSL -o dbin.diff https://raw.githubusercontent.com/NetBSD/pkgsrc/6034096dc85159a02116524692545cf5752c8f33/databases/db5/patches/patch-src_dbinc_db.in
          echo '86111b0965762f2c2611b302e4a95ac8df46ad24925bbb95a1961542a1542e40  clang.diff' | shasum -a 256 -c
          echo '83af02f2aa2b746bb7225872cab29a253264be49db0ecebb12f841562d9a2923  libtool.diff' | shasum -a 256 -c
          echo '302b78f3e1f131cfbf91b24e53a5c79e1d9234c143443ab936b9e5ad08dea5b6  dbin.diff' | shasum -a 256 -c
          patch -d db-5.3.28/src -p1 < clang.diff
          patch -d db-5.3.28/dist -p1 < libtool.diff
          patch -d db-5.3.28 -p0 < dbin.diff
          cd db-5.3.28/build_unix
          CFLAGS='-Wno-implicit-function-declaration' ../dist/configure \
            --prefix="$RUNNER_TEMP/bdb" --enable-cxx --disable-shared --enable-static
          make
          make install
          cd "$RUNNER_TEMP"
          curl -fsSL -o openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
          echo '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  openssl.tar.gz' | shasum -a 256 -c
          tar -xf openssl.tar.gz
          cd openssl-3.5.9
          ./Configure darwin64-x86_64-cc no-shared --prefix="$RUNNER_TEMP/ssl" --libdir=lib
          make -j3
          make install_sw
      - name: Build core
        run: |
          export MACOSX_DEPLOYMENT_TARGET=10.13
          db="$RUNNER_TEMP/bdb"
          ssl="$RUNNER_TEMP/ssl"
          make -f makefile.cli -j3 \
            MACOS_MIN_VERSION=10.13 \
            BDB_INCLUDE_PATH="$db/include" \
            BDB_LIB_PATH="$db/lib" \
            OPENSSL_INCLUDE_PATH="$ssl/include" \
            OPENSSL_LIB_PATH="$ssl/lib"
          mkdir -p core
          cp nexus core/nexus-darwin-x64
          otool -L core/nexus-darwin-x64
          otool -l core/nexus-darwin-x64 | grep -A5 LC_VERSION_MIN_MACOSX
          file core/nexus-darwin-x64
      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: macos-core
          path: core/
          if-no-files-found: error
