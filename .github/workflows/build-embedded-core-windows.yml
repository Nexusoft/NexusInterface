name: Build embedded Windows core

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: LLL-TAO commit to build
        required: true
        default: 2a3c58e8e90a7c7bad52aa8d59cc25f3c626af1b

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out core source
        uses: actions/checkout@v4
        with:
          repository: NamecoinGithub/LLL-TAO
          ref: ${{ inputs.core_ref }}
      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            curl
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-zlib
      - name: Build Berkeley DB
        run: |
          set -euxo pipefail
          temp="$(cygpath -u "$RUNNER_TEMP")"
          cd "$temp"
          curl -fsSL -o db.tar.gz https://download.oracle.com/berkeley-db/db-5.3.28.tar.gz
          echo 'e0a992d740709892e81f9d93f06daf305cf73fb81b545afe72478043172c3628  db.tar.gz' | sha256sum -c
          tar -xf db.tar.gz
          sed -i 's/__atomic_compare_exchange/__atomic_compare_exchange_db/g' db-5.3.28/src/dbinc/atomic.h
          cd db-5.3.28/build_unix
          CFLAGS='-O2 -std=gnu11' ../dist/configure --prefix="$temp/bdb" --enable-mingw --enable-cxx \
            --disable-shared --enable-static --disable-replication
          make -j2
          make install
      - name: Build OpenSSL
        run: |
          set -euxo pipefail
          temp="$(cygpath -u "$RUNNER_TEMP")"
          cd "$temp"
          curl -fsSL -o openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
          echo '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  openssl.tar.gz' | sha256sum -c
          tar -xf openssl.tar.gz
          cd openssl-3.5.9
          MSYS2_ARG_CONV_EXCL="--prefix=" perl ./Configure mingw64 no-shared --prefix="$temp/ssl" --libdir=lib
          make -j2
          make install_sw
      - name: Build core
        run: |
          set -euxo pipefail
          temp="$(cygpath -u "$RUNNER_TEMP")"
          ssl="$temp/ssl"
          db="$temp/bdb"
          make -f makefile.cli -j2 \
            OPENSSL_LIB_PATH="$ssl/lib" \
            OPENSSL_INCLUDE_PATH="$ssl/include" \
            BDB_LIB_PATH="$db/lib" \
            BDB_INCLUDE_PATH="$db/include" \
            LIBS="$db/lib/libdb_cxx.a $ssl/lib/libssl.a $ssl/lib/libcrypto.a -lkernel32 -luser32 -lgdi32 -lcomdlg32 -lwinspool -lwinmm -lshell32 -lcomctl32 -lole32 -loleaut32 -luuid -lrpcrt4 -ladvapi32 -lws2_32 -lshlwapi -lcrypt32 -liphlpapi -lbcrypt"
          mkdir -p core
          cp release/nexus.exe core/nexus-win32-x64.exe
          strings core/nexus-win32-x64.exe | grep -F 'OpenSSL 3.5.9'
          objdump -p core/nexus-win32-x64.exe | grep 'DLL Name'
          if objdump -p core/nexus-win32-x64.exe | grep -iE 'DLL Name: (libdb|libssl|libcrypto|libgcc|libstdc|libwinpthread)'; then
            echo 'Unexpected non-system DLL dependency' >&2
            exit 1
          fi
      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: windows-static-core
          path: core/
          if-no-files-found: error
