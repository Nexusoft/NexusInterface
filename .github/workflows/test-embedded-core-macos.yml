name: Test embedded macOS core

on:
  push:
    branches:
      - copilot/refresh-node5-embedded-cores
    paths:
      - .github/workflows/test-embedded-core-macos.yml

jobs:
  smoke:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Download built core
        uses: actions/download-artifact@v4
        with:
          name: macos-core
          run-id: 42919730116
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test core startup and API
        shell: bash
        run: |
          set -euo pipefail
          chmod +x nexus-darwin-x64
          mkdir -p "$RUNNER_TEMP/nexus-smoke"
          ./nexus-darwin-x64 \
            "-datadir=$RUNNER_TEMP/nexus-smoke" -private=1 -listen=0 \
            -manager=0 -nodns=1 -apiauth=0 -apiport=18483 \
            > "$RUNNER_TEMP/nexus-smoke.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          for i in {1..90}; do
            if curl --noproxy '*' -fsS http://127.0.0.1:18483/system/get/info > "$RUNNER_TEMP/response.json"; then
              python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))["result"]["version"]; print(v); assert "5.1.7-rc6 build 1" in v' "$RUNNER_TEMP/response.json"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/nexus-smoke.log"
          exit 1
